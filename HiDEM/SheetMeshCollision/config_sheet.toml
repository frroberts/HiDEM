[general]
# set size scale of particles and the entire system
scale = 7.5

g = 9.81
beamWidth = 1.2
E = 2e+9
waterLevel = 375.0
maxVel = 20.0
maxRot = 5.0
bedInteract = 0.5
bedStiffness = 1e+8
waterDrag = 200.0
airDrag = 10.0
bedDrag = 10.0
damping = 10000.0
dampingRotation = 10000.0
rhoIce = 910.0
rhoWater = 1030.0
maxLoad = 15e-4
bendBreak = 0.03
attractDistance = 0.01
attractScaleForce = 1e-5

# DT
dt = 0.0001
# when to allow link breaking to start, in simulated time
breakTime = 0.0

[iteration]
# number of iterations to run
timeSteps = 8000000
# interval of how often to output
outputInterval = 1000

[externalForce]
# external forces to be applied each time step
# this section is under development, and will change when force changing over time gets implemented
xForce = 500000.0
yForce = 0.0
zForce = 0.0
uForce = 0.0
vForce = 0.0
wForce = 0.0

[output]
# path to work from
outWorkingPath = "../Data/"
# The program will add the appropriate prefix to this name, wont be written if left empty or not present
outParticleFile = "pOut"
# the type of output we use, CSV or HDF5, VTK (buggy), VKTHDF
outParticleType = "VTKHDF"
# The program will add the appropriate prefix to this name, wont be written if left empty or not present
outLinkFile = ""
# the type of output we use, CSV or HDF5
outLinkType = ""
# path for where to output the resulting mesh, will inherit working path from output
# ignored if no collision mesh is provided
outMeshFile = "mOut"
# the type of output we use, mehses only supported with VTKHDF
outMeshType = "VTKHDF"

[grid]
# searchDistanceScale will compute max particle diameter * searchDistanceScale and use it for the distance
searchDistanceScale = 1.8
# interval at which to regenerate the neighbour grid, there is no automation for when this should be done so keep it somewhat short
gridRegenInterval = -1

[restart]
# file to restart from if this is set it will look for the file to restart from
# fromRestart = ""
# enable checkpoint writing at end
writeEndCheckpoint = true
# interval at which to write the checkpoint -1 for no periodic
checkpointInterval = -1
# directory name in the woing path to create the checkpoints in
checkpointDirectory = "checkpoints"
# append timestep to filename, if false it will only keep one file
timestepCheckpoint = true

[distribution]
reBalance = true
# tolerance to aim for at each split
reBalanceTolerance = 0.001
# at what iteration to do the first rebalance, to get the particles a chance to move a bit for a better balance result
firstBalanceTimestep = 2000
# number of points to sample from the geometry for the initial balance step
initBalancePoints = 10000
# tolerance to aim for at each split
initBalanceTolerance = 0.01
# how big should the halos be, done as searchDistance * haloScale
haloScale = 10

# unscaled radius and spacing
[lattice]
type = "FCC"
# yeah these constants are a bit arbitrary
particleRadius = 0.561231024154686
fccSpacing = 1.5874010519682
linkGenScale = 1.2

# seed for random generation
seed = 1
# offset to add to seed for each rank
seedOffset = 10
# center the generated geometry around zero
zeroCenter = false

[world]

zInputUpper = 1000.0
zInputLower = 0.0

# Boundary conditions enforced
xBoundaryMin = false
yBoundaryMin = true
xBoundaryMax = false
yBoundaryMax = true

[[iceParameters]]
# glacier
linkGenerateProbability = 1.0
boundingGeometry = "sheet AND bb NOT (cone)"
linkWith = [0]

[[geometry]]
type = "box"
name = "sheet"
upper =[1900, 900, 380]
lower = [-2000, -900, 360]

[[geometry]]
type = "box"
name = "bb"
upper =[1900, 900,400]
lower = [-1900, -900, 350]

[collisionMeshParameters]
# particle radius (max, scaled) * cellSizeScale = cellSize
cellSizeScale = 4.0
# how much buffer to have in each cell counted as partilcle radius * rangeFactor
rangeFactor = 1.5


[[collisionGeometry]]
type = "mesh"
name = "cone"
path = "../HiDEM/SheetMeshCollision/cone.obj"
scale= [150,100,160]
position = [955,-350,370]
shellScale = 5.0
