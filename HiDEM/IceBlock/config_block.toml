[general]
# set size scale of particles and the entire system
scale = 5.0

g = 9.81
beamWidth = 0.5
E = 2e+9
waterLevel = 0.0
bedInteract = 0.5
bedStiffness = 2e+8
waterDrag = 200.0
airDrag = 10.0
bedDrag = 10.0
damping = 10000.0
dampingRotation = 10000.0
rhoIce = 910.0
rhoWater = 1030.0
maxLoad = 5e-4
bendBreak = 0.01
attractDistance = 0.01
attractScaleForce = 1e-5

# DT
dt = 0.001
# when to allow link breaking to start, in simulated time
breakTime = 10.0

[iteration]
# number of iterations to run
timeSteps = 60000
# interval of how often to output
outputInterval = 1000

[output]
# path to work from
outWorkingPath = "../Data/"
# The program will add the appropriate prefix to this name, wont be written if left empty or not present
outParticleFile = "pOut"
# the type of output we use, CSV or HDF5, VTK (buggy), VKTHDF
outParticleType = "VTKHDF"

[grid]
# searchDistanceScale will compute max particle diameter * searchDistanceScale and use it for the distance
searchDistanceScale = 1.4

[distribution]
# how big should the halos be, done as searchDistance * haloScale
haloScale = 1.2

# unscaled radius and spacing
[lattice]
type = "FCC"
# yeah these constants are a bit arbitrary
particleRadius = 0.5
fccSpacing = 1.41421
linkGenScale = 1.2

[[iceParameters]]
# glacier
linkGenerateProbability = 1.0
boundingGeometry = "block NOT cut"
linkWith = [0]

[[geometry]]
type = "box"
name = "block"
lower = [-200,-200,-20]
upper = [200,200,60]

[[geometry]]
type = "box"
name = "cut"
lower = [-200,-200,20]
upper = [-150,200,60]